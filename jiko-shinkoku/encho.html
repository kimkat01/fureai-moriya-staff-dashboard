<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自己申告の集計（試用版・事務用）｜ふれあいしおどめ保育園</title>
<link rel="stylesheet" href="common.css">
<style>
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.top h2{margin:0;font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{width:auto;padding:0 18px;height:44px;font-size:15px}
.stats4{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stats4 div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats4 b{display:block;font-size:22px;color:var(--blue-d)}
.stats4 span{font-size:12px;font-weight:700;color:var(--ink2)}
.filt{max-width:520px}
table.mt td.nm{font-weight:700;color:var(--blue-d);text-decoration:underline}
table.mt th.grp{text-align:center;background:#dfe6fb}
.setgrid select,.setgrid input{height:38px;font-size:14px;border:1px solid #b9b8b1;border-radius:8px;padding:0 6px;background:#fff}
@media (max-width:640px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="ttl">自己申告の集計（試用版・事務用）</div><div class="sub" id="fac">ふれあいしおどめ保育園</div></div>
</div>
<div class="wrap wide">
  <div class="demo hidden" id="demo">お試しモード：この端末のブラウザに保存された申告だけが表示されます（同じ端末の職員用ページで入力した内容）。</div>
  <div id="loading" class="loading">読み込んでいます…</div>
  <div id="fatal" class="err hidden"></div>

  <div id="main" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <div class="top">
      <div><h2 id="perTitle"></h2><div class="muted" id="perSub"></div></div>
      <div class="acts">
        <button type="button" class="btn2" id="btnReload">最新にする</button>
        <button type="button" class="btn2" id="btnSet">職員の設定</button>
        <button type="button" class="btn" id="btnXlsx">締め用Excelを出力</button>
      </div>
    </div>
    <div class="err" id="xlsxErr"></div>
    <div class="stats4" id="stats4"></div>
    <div class="seg filt" role="tablist">
      <button type="button" data-f="all" class="on">全員</button>
      <button type="button" data-f="パート">パート</button>
      <button type="button" data-f="正規">正規</button>
      <button type="button" data-f="ng">未確定のみ</button>
    </div>
    <div id="list"></div>
    <div class="muted">名前を押すと、その職員の1か月の表が開きます。事務はそこで、確定後でも直せます。<br>
      ⑥＝出勤・有休・特休の日のシフト時間（休憩を引いた実働）の合計、⑦＝予定との差（＋−）の合計。給与の試算は（⑥＋⑦）×時給です。<br>
      休憩は、拘束6時間を超えるシフトは一律60分（短時間勤務・変形労働も同じ）、6時間以下のシフトは休憩なしとして計算しています。</div>
  </div>
</div>

<div id="modal" class="modal-bg hidden"><div class="modal big" id="modalBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="common.js"></script>
<script>
let SH = null, G = { recs: {}, conf: {}, set: {}, back: {} }, FILT = 'all', ROWS = [];
function $(id) { return document.getElementById(id); }
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function setOf(name) { return effSetting(name, G, SH.staff.find((x) => x.name === name), SH); }

async function init() {
  if (isDemo()) show('demo', true);
  try { SH = await loadShift(); await reload(); }
  catch (e) { show('loading', false); show('fatal', true); $('fatal').textContent = e.message; return; }
  show('loading', false); show('main', true);
  $('fac').textContent = SH.facility;
  $('perTitle').textContent = SH.label;
  $('perSub').textContent = SH.start + '〜' + SH.end + '（' + SH.dates.length + '日）';
  draw();
}
async function reload() { G = groupLoad(await api('load', { pid: SH.pid })); }

function compute() {
  ROWS = SH.staff.map((s) => {
    const set = setOf(s.name);
    const t = calcStaff(SH, s, G.recs[s.name] || {}, set, !!G.conf[s.name], G.back[s.name]);
    if (set.kubun === '対象外') t.status = '対象外';
    return { s, set, t, unset: set.kubunSrc === '初期値' };
  });
  // 対象外（育休など）は一覧の最後に回す
  ROWS.sort((a, b) => (a.set.kubun === '対象外') - (b.set.kubun === '対象外'));
}
function draw() {
  compute();
  const act = ROWS.filter((r) => r.set.kubun !== '対象外');
  const cnt = (f) => act.filter(f).length;
  $('stats4').innerHTML =
    '<div><b>' + cnt((r) => r.t.status === '確定') + ' / ' + act.length + '</b><span>確定済み（対象外 ' + (ROWS.length - act.length) + '名を除く）</span></div>' +
    '<div><b>' + cnt((r) => r.t.status === '入力中' || r.t.status === '入力完了') + '</b><span>入力中・未確定</span></div>' +
    '<div><b style="color:#b3261e">' + cnt((r) => r.t.status === '未申告あり') + '</b><span>未申告の日あり</span></div>' +
    '<div><b style="color:#8a3200">' + cnt((r) => r.t.status === '差し戻し中') + '</b><span>差し戻し中（本人が修正中）</span></div>' +
    '<div><b style="color:#7a4a00">' + cnt((r) => r.unset) + '</b><span>職員マスタに区分なし</span></div>';
  const rows = ROWS.filter((r) => FILT === 'all' || (FILT === 'ng' ? (r.t.status !== '確定' && r.t.status !== '対象外') : r.set.kubun === FILT));
  let h = '<div class="tblwrap"><table class="mt"><thead><tr><th rowspan="2">職員名</th><th rowspan="2">区分</th><th rowspan="2">状態</th><th rowspan="2">入力</th>' +
    '<th class="grp" colspan="6">日数</th><th class="grp" colspan="4">パート</th><th class="grp" colspan="5">正規</th></tr><tr>' +
    '<th>①出勤</th><th>②有休</th><th>③特休</th><th>④公休</th><th>⑤希望休</th><th>欠勤</th>' +
    '<th>⑥予定h</th><th>⑦差h</th><th>⑧給食</th><th>⑨駐車</th>' +
    '<th>時間有休</th><th>残業</th><th>遅刻</th><th>早退</th><th>駐車</th></tr></thead><tbody>';
  rows.forEach((r) => {
    const t = r.t, c = t.c, p = r.set.kubun === 'パート';
    h += '<tr class="click" data-name="' + esc(r.s.name) + '"><td class="nm">' + esc(r.s.name) + '</td><td>' + esc(r.set.kubun) + '<span style="color:#4a4a46;font-size:11px">（' + esc(r.set.kubunSrc) + '）</span>' + '</td><td>' + statusBadge(t.status) +
      (t.warn.length ? ' <span title="' + esc(t.warn.join('、')) + '" style="color:#7a4a00;font-size:11px">要確認</span>' : '') + '</td><td class="num">' + t.done + '/' + t.n + '</td>' +
      '<td class="num">' + c['出勤'] + '</td><td class="num">' + c['有休'] + '</td><td class="num">' + c['特休'] + '</td><td class="num">' + c['公休'] + '</td><td class="num">' + c['希望休'] + '</td><td class="num">' + c['欠勤'] + '</td>' +
      (p ? '<td class="num">' + toHours(t.plan) + '</td><td class="num">' + toHours(t.diff) + '</td><td class="num">' + t.kyu + '</td><td class="num">' + t.chu + '</td><td></td><td></td><td></td><td></td><td></td>'
         : '<td></td><td></td><td></td><td></td><td class="num">' + (t.yh ? t.yh + 'h' : '') + '</td><td class="num">' + (t.ot ? fmtHM(t.ot) : '') + '</td><td class="num">' + (t.late ? fmtHM(t.late) : '') + '</td><td class="num">' + (t.early ? fmtHM(t.early) : '') + '</td><td class="num">' + (r.set.parking ? t.chu : '') + '</td>') +
      '</tr>';
  });
  $('list').innerHTML = h + '</tbody></table></div>';
}
$('list').onclick = (e) => { const tr = e.target.closest('tr[data-name]'); if (tr) openStaff(tr.dataset.name); };
document.querySelectorAll('.filt button').forEach((b) => b.onclick = () => {
  FILT = b.dataset.f; document.querySelectorAll('.filt button').forEach((x) => x.classList.toggle('on', x === b)); draw();
});
$('btnReload').onclick = async () => { try { await reload(); draw(); } catch (e) { alert(e.message); } };

/* ---------- 職員ごとの1か月 ---------- */
function closeModal() { show('modal', false); $('modalBody').innerHTML = ''; draw(); }
$('modal').onclick = (e) => { if (e.target === $('modal')) closeModal(); };
function openStaff(name, dayIso) {
  const s = SH.staff.find((x) => x.name === name);
  const set = setOf(name);
  const recs = G.recs[name] || {};
  const conf = !!G.conf[name];
  const back = G.back[name] || null;
  const t = calcStaff(SH, s, recs, set, conf, back);
  const park = set.kubun === 'パート' ? true : !!set.parking;
  let h = '<div class="row"><div><b style="font-size:17px">' + esc(name) + '</b> <span class="badge b-blue">' + esc(set.kubun) + '</span> ' + statusBadge(t.status) + '</div>' +
    '<button type="button" class="btn2" id="mClose">閉じる</button></div>';
  h += statsHTML(t);
  if (t.warn.length) h += '<div class="demo">' + esc(t.warn.join('、')) + '。「職員の設定」で有休1日分の時間を入れてください。</div>';
  if (back && !conf) {
    h += '<div class="backbox"><div class="bt">差し戻し中（' + esc(backAt(back.at)) + '）— 本人が直して、もう一度提出するのを待っています</div>' +
      '<div class="bm">' + esc(back.msg) + '</div>' +
      (back.days.length ? '<div class="muted">直してほしい日：' + back.days.map((iso) => esc(backDayLabel(SH, iso))).join('、') + '</div>' : '') +
      '<div><button type="button" class="btn2" id="mBackClear">差し戻しを取り消す（お知らせを消す）</button></div></div>';
  }
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start"><div id="mTable">' + monthTableHTML(SH, s, recs, set.kubun, park, back && !conf ? back.days : []) + '</div><div id="mForm"><div class="note">左の表で日付を押すと、その日の申告を直せます。<br>本人に直してもらいたいときは、下の「差し戻す」を押してください。</div></div></div>';
  h += '<div class="acts"><button type="button" class="btn2" id="mBack" style="border-color:#d9590f;color:#8a3200">差し戻す（本人に直してもらう）</button>' +
    (conf ? '' : '<button type="button" class="btn2" id="mConf">事務が代わりに確定する</button>') + '</div>';
  $('modalBody').innerHTML = h; show('modal', true);
  $('mClose').onclick = closeModal;
  const mt = $('mTable');
  mt.onclick = (e) => { const tr = e.target.closest('tr[data-date]'); if (tr) openDay(name, tr.dataset.date); };
  $('mBack').onclick = () => openBackForm(name);
  const bc = $('mBackClear'); if (bc) bc.onclick = async () => {
    if (!confirm('差し戻しを取り消しますか？（本人の画面のお知らせが消えます。確定はされません）')) return;
    try { await api('clearback', { pid: SH.pid, name }); delete G.back[name]; openStaff(name); } catch (e) { alert(e.message); }
  };
  const c = $('mConf'); if (c) c.onclick = async () => {
    if (t.missing.length && !confirm('未申告の日が ' + t.missing.length + '日 あります。このまま確定しますか？')) return;
    await api('confirm', { pid: SH.pid, name }); G.conf[name] = new Date().toISOString(); delete G.back[name]; openStaff(name);
  };
  if (dayIso) openDay(name, dayIso);
}
/* ---------- 差し戻し（2026-11-10追加） ----------
   理由を書き、必要なら直してほしい日を選んで、本人に差し戻す。
   確定済みでも入力完了でも使える。差し戻すと確定が外れ、本人が直せるようになる。 */
function openBackForm(name) {
  const sel = {};
  const back = G.back[name];
  if (back) back.days.forEach((d) => { sel[d] = true; });
  function chips() {
    return SH.dates.map((d) => '<button type="button" class="chip sm' + (sel[d.iso] ? ' on' : '') + '" data-d="' + d.iso + '" aria-pressed="' + !!sel[d.iso] + '">' + esc(d.md) + ' ' + esc(d.dow) + '</button>').join('');
  }
  $('mForm').innerHTML = '<div class="backbox"><div class="bt">' + esc(name) + 'さんに差し戻す</div>' +
    '<div class="lbl" style="margin:0">理由・直してほしいこと（本人の画面にそのまま出ます）</div>' +
    '<textarea class="in" id="bMsg" placeholder="例）11/5は早番ではなく日勤でした。勤務時間を直してください。">' + esc(back ? back.msg : '') + '</textarea>' +
    '<div class="lbl" style="margin:0">直してほしい日（わかれば選ぶ・いくつでも）</div><div class="chips" id="bDays">' + chips() + '</div>' +
    '<div class="muted">左の表で日付を押しても選べます。差し戻すと「確定」が外れ、本人が直して、もう一度提出できるようになります。</div>' +
    '<button type="button" class="btn back" id="bSend">差し戻す</button><div class="err" id="bErr"></div>' +
    '<div><button type="button" class="btn2" id="bCancel">やめる</button></div></div>';
  const mt = $('mTable');
  const toggle = (iso) => { sel[iso] = !sel[iso]; if (!sel[iso]) delete sel[iso]; $('bDays').innerHTML = chips(); };
  $('bDays').onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) toggle(b.dataset.d); };
  mt.onclick = (e) => { const tr = e.target.closest('tr[data-date]'); if (tr) toggle(tr.dataset.date); };
  $('bCancel').onclick = () => openStaff(name);
  $('bSend').onclick = async () => {
    const msg = $('bMsg').value.trim();
    if (!msg) { $('bErr').textContent = '理由・直してほしいことを入れてください'; return; }
    const days = SH.dates.map((d) => d.iso).filter((iso) => sel[iso]);
    if (!confirm(name + 'さんに差し戻します。よろしいですか？')) return;
    $('bSend').disabled = true; $('bErr').textContent = '';
    try {
      await api('sendback', { pid: SH.pid, name, msg, days });
      delete G.conf[name]; G.back[name] = { days, msg, at: new Date().toISOString().slice(0, 10) };
      openStaff(name);
    } catch (e) { $('bSend').disabled = false; $('bErr').textContent = e.message; }
  };
  $('mForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function openDay(name, iso) {
  const s = SH.staff.find((x) => x.name === name);
  const set = setOf(name);
  const d = SH.dates.find((x) => x.iso === iso);
  renderForm($('mForm'), {
    pid: SH.pid, name, kubun: set.kubun, parking: set.kubun === 'パート' ? true : !!set.parking,
    date: d, sh: s.shifts[iso], rec: (G.recs[name] || {})[iso] || null, locked: false, by: '事務',
    onSaved: (rec) => { (G.recs[name] = G.recs[name] || {})[iso] = rec; openStaff(name, iso); }
  });
}

/* ---------- 職員の設定 ---------- */
$('btnSet').onclick = () => {
  let h = '<div class="row"><b style="font-size:17px">職員の設定</b><button type="button" class="btn2" id="sClose">閉じる</button></div>' +
    '<div class="muted">ふだんは何も入れなくて大丈夫です。区分は職員マスタの雇用区分から、有休・特休1日分の時間はその月の勤務日の平均から自動で決まります。<br>' +
    '違うときだけ、ここで変えてください（変えるとすぐ保存され、自動より優先されます）。正規の駐車場（日割り対象）は、井波さん・登坂さんを固定で対象にしています。ほかに対象の人が増えたときだけチェックしてください。</div>' +
    '<div class="tblwrap setgrid"><table class="mt"><thead><tr><th>職員名</th><th>区分</th><th>駐車場 日割り（正規）</th><th>有休・特休1日分の時間</th><th></th></tr></thead><tbody>';
  SH.staff.forEach((s) => {
    const st = setOf(s.name), man = G.set[s.name] || {};
    const hm = splitMin(+man.yukyuMin > 0 ? man.yukyuMin : 0);
    const autoK = st.masterKubun ? '自動（職員マスタ：' + st.masterKubun + '）' : '自動（マスタになし→パート）';
    h += '<tr data-name="' + esc(s.name) + '"><td><b>' + esc(s.name) + '</b></td>' +
      '<td><select data-k="kubun"><option value=""' + (!man.kubun ? ' selected' : '') + '>' + esc(autoK) + '</option>' +
      ['パート', '正規', '対象外'].map((k) => '<option value="' + k + '"' + (man.kubun === k ? ' selected' : '') + '>' + k + '（手入力）</option>').join('') + '</select></td>' +
      '<td><label><input type="checkbox" data-k="parking"' + (st.parking ? ' checked' : '') + (st.parkingFixed ? ' disabled' : '') + ' style="height:20px;width:20px;vertical-align:middle"> 対象' + (st.parkingFixed ? '（固定）' : '') + '</label></td>' +
      '<td><select data-k="yh">' + hourOpts(0, 10, hm.h) + '</select> 時間 <select data-k="ym">' + minOpts(hm.m) + '</select> 分' +
      '<div class="yauto" style="font-size:11px;color:#4a4a46">' + (+man.yukyuMin > 0 ? '手入力' : '0:00＝自動（平均 ' + fmtJP(st.avgMin) + '）') + '</div></td>' +
      '<td class="ok" style="font-size:12px;color:#1e7a45"></td></tr>';
  });
  h += '</tbody></table></div>';
  $('modalBody').innerHTML = h; show('modal', true);
  $('sClose').onclick = closeModal;
  $('modalBody').onchange = async (e) => {
    const tr = e.target.closest('tr[data-name]'); if (!tr) return;
    const name = tr.dataset.name;
    const setting = {
      kubun: tr.querySelector('[data-k=kubun]').value,
      parking: tr.querySelector('[data-k=parking]').checked,
      yukyuMin: (+tr.querySelector('[data-k=yh]').value) * 60 + (+tr.querySelector('[data-k=ym]').value)
    };
    const ok = tr.querySelector('.ok'); ok.style.color = '#1e7a45'; ok.textContent = '保存中…';
    try {
      await api('setting', { name, setting });
      G.set[name] = Object.assign({ name }, setting);
      ok.textContent = '保存しました';
      tr.querySelector('.yauto').textContent = setting.yukyuMin > 0 ? '手入力' : '0:00＝自動（平均 ' + fmtJP(setOf(name).avgMin) + '）';
    } catch (er) { ok.style.color = '#b3261e'; ok.textContent = er.message; }
  };
};

/* ---------- Excel出力（事務のひな形の形） ---------- */
$('btnXlsx').onclick = async () => {
  $('xlsxErr').textContent = '';
  try { await makeXlsx(); } catch (e) { $('xlsxErr').textContent = 'Excelを作れませんでした：' + e.message; }
};
async function makeXlsx() {
  if (!window.ExcelJS) throw new Error('Excel作成の部品を読み込めませんでした（ネット接続を確認してください）');
  compute();
  const FONT = { name: 'ＭＳ ゴシック', size: 12 };
  const BOLD = { name: 'ＭＳ ゴシック', size: 12, bold: true };
  const thin = { style: 'thin', color: { argb: 'FF999999' } };
  const BORDER = { top: thin, left: thin, bottom: thin, right: thin };
  const HEAD = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9EEFC' } };
  const n = SH.dates.length;
  const wb = new ExcelJS.Workbook();
  wb.creator = '自己申告（試用版）';

  /* --- パート（事務のひな形と同じ並び） --- */
  const ws = wb.addWorksheet('パート');
  // 2026-11-10：パートにも欠勤を追加したため、⑤希望休の右に「欠勤累計」の列（G列）を入れた
  ws.columns = [{ width: 18 }, { width: 11 }, { width: 15 }, { width: 15 }, { width: 11 }, { width: 11 }, { width: 11 }, { width: 28 }, { width: 14 }, { width: 11 }, { width: 11 }, { width: 11 }, { width: 11 }, { width: 14 }, { width: 15 }, { width: 15 }, { width: 10 }];
  ws.getCell('A1').value = '職員名';
  ws.mergeCells('B1:G1'); ws.getCell('B1').value = '申告';
  ws.getCell('H1').value = 'シフトから引用（予定どおり）';
  ws.mergeCells('I1:K1'); ws.getCell('I1').value = '申告';
  ws.mergeCells('L1:M1'); ws.getCell('L1').value = '事務が入力';
  ws.mergeCells('N1:P1'); ws.getCell('N1').value = '確認';
  ws.getCell('Q1').value = '状態';
  ['', '➀', '②', '③', '④', '⑤', '', '⑥', '⑦', '⑧', '⑨'].forEach((v, i) => { if (v) ws.getRow(2).getCell(i + 1).value = v; });
  ['', '出勤日累計', '有休取得日累計', '特休取得日累計', '公休累計', '希望休累計', '欠勤累計', '勤務実績累計', '時間変更累計', '給食累計', '駐車場累計', '時給', '通勤単価', '日数確認', '給与（試算）', '通勤手当（試算）', ''].forEach((v, i) => { if (v) ws.getRow(3).getCell(i + 1).value = v; });
  let r = 4;
  ROWS.filter((x) => x.set.kubun === 'パート').forEach((x) => {
    const t = x.t, c = t.c;
    const row = ws.getRow(r);
    row.values = [x.s.name, c['出勤'], c['有休'], c['特休'], c['公休'], c['希望休'], c['欠勤'], toHours(t.plan), toHours(t.diff), t.kyu, t.chu, null, null];
    row.getCell(14).value = { formula: 'IF(SUM(B' + r + ':G' + r + ')=' + n + ',"OK","NG（"&SUM(B' + r + ':G' + r + ')&"日）")' };
    row.getCell(15).value = { formula: 'IF(L' + r + '="","",ROUND((H' + r + '+I' + r + ')*L' + r + ',0))' };
    row.getCell(16).value = { formula: 'IF(M' + r + '="","",(B' + r + '+C' + r + ')*M' + r + ')' };
    row.getCell(17).value = t.status;
    r++;
  });
  const last = r - 1;
  for (let i = 1; i <= Math.max(last, 3); i++) for (let j = 1; j <= 17; j++) {
    const cell = ws.getRow(i).getCell(j);
    cell.font = i <= 3 ? BOLD : FONT; cell.border = BORDER;
    if (i <= 3) { cell.fill = HEAD; cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; }
    if (i > 3 && (j === 8 || j === 9)) cell.numFmt = '0.00';
    if (i > 3 && (j === 12 || j === 13 || j === 15 || j === 16)) cell.numFmt = '#,##0';
  }
  const notes = [
    ['期間', SH.label + '（' + SH.start + '〜' + SH.end + '、' + n + '日）　出力：' + new Date().toLocaleString('ja-JP')],
    ['日数確認', '＊①＋②＋③＋④＋⑤＋欠勤の合計が期間の日数（' + n + '日）になるかを確認（N列）'],
    ['給与確認', '＊（⑥＋⑦）×時給 がその月の給与支給額になる（O列）'],
    ['', '⑥＝出勤・有休・特休の日のシフト時間（休憩を引いた実働）の合計、⑦＝予定との差（＋−）の合計。時間は小数（6.5＝6時間30分）'],
    ['通勤手当確認', '＊（①＋②）×通勤単価がその月の通勤手当になる（P列）'],
    ['注', '欠勤は給与・通勤手当とも対象外（⑥にも入らない）'],
    ['注', '②有休と③特休は給与支給'],
    ['注', '②有休は通勤手当支給'],
    ['注', '③特休は通勤手当対象外'],
    ['注', '休憩は拘束6時間超のシフトは一律60分、6時間以下は休憩なしとして計算'],
    ['注', '時給・通勤単価（L・M列）は事務が入力してください']
  ];
  r = last + 2;
  notes.forEach((nt) => { const row = ws.getRow(r++); row.getCell(1).value = nt[0]; row.getCell(2).value = nt[1]; row.getCell(1).font = BOLD; row.getCell(2).font = FONT; });
  ws.views = [{ state: 'frozen', xSplit: 1, ySplit: 3 }];

  /* --- 正規 --- */
  const w2 = wb.addWorksheet('正規');
  const h2 = ['職員名', '出勤', '公休', '希望休', '有休', '特休', '欠勤', '時間有休（時間）', '残業（時間）', '遅刻（時間）', '早退（時間）', '駐車場（日割り）', '日数確認', '状態'];
  w2.columns = h2.map((x, i) => ({ width: i === 0 ? 18 : (i >= 7 && i <= 11 ? 15 : 10) }));
  w2.getRow(1).values = h2;
  r = 2;
  ROWS.filter((x) => x.set.kubun === '正規').forEach((x) => {
    const t = x.t, c = t.c;
    w2.getRow(r).values = [x.s.name, c['出勤'], c['公休'], c['希望休'], c['有休'], c['特休'], c['欠勤'], t.yh, toHours(t.ot), toHours(t.late), toHours(t.early), x.set.parking ? t.chu : '対象外', null, t.status];
    w2.getRow(r).getCell(13).value = { formula: 'IF(SUM(B' + r + ':G' + r + ')=' + n + ',"OK","NG（"&SUM(B' + r + ':G' + r + ')&"日）")' };
    r++;
  });
  for (let i = 1; i < Math.max(r, 2); i++) for (let j = 1; j <= h2.length; j++) {
    const cell = w2.getRow(i).getCell(j); cell.font = i === 1 ? BOLD : FONT; cell.border = BORDER;
    if (i === 1) { cell.fill = HEAD; cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; }
    if (i > 1 && j >= 9 && j <= 11) cell.numFmt = '0.00';
  }
  const r2 = w2.getRow(r + 1); r2.getCell(1).value = '期間'; r2.getCell(2).value = SH.label + '（' + SH.start + '〜' + SH.end + '、' + n + '日）'; r2.getCell(1).font = BOLD; r2.getCell(2).font = FONT;
  const r3 = w2.getRow(r + 2); r3.getCell(1).value = '注'; r3.getCell(2).value = '遅刻・早退は時間有休を使った分を含めない。時間は小数（1.5＝1時間30分）'; r3.getCell(1).font = BOLD; r3.getCell(2).font = FONT;
  w2.views = [{ state: 'frozen', xSplit: 1, ySplit: 1 }];

  /* --- 日別明細（確認用） --- */
  const w3 = wb.addWorksheet('日別明細');
  const h3 = ['職員名', '区分', '日付', '曜日', 'シフト', '申告', '勤務入力', '勤務時間', '給食', '駐車場', '時間有休', '残業', '遅刻', '早退', '入力者'];
  w3.columns = h3.map((x, i) => ({ width: [18, 8, 12, 6, 22, 8, 10, 10, 8, 8, 9, 9, 9, 9, 8][i] }));
  w3.getRow(1).values = h3;
  r = 2;
  ROWS.forEach((x) => {
    SH.dates.forEach((d) => {
      const rec = (G.recs[x.s.name] || {})[d.iso];
      const w = rec && rec.kind === '出勤';
      w3.getRow(r).values = [x.s.name, x.set.kubun, d.iso, d.dow, shiftText(x.s.shifts[d.iso]), rec ? rec.kind : '未申告',
        w && x.set.kubun === 'パート' ? (rec.mode === 'edit' ? '変更' : '予定どおり') : '', w && x.set.kubun === 'パート' ? fmtHM(rec.min) : '',
        w && rec.kyu === 'yes' ? '○' : '', w && rec.chu === 'yes' ? '○' : '', w && +rec.yh ? rec.yh : '', w && +rec.ot ? fmtHM(rec.ot) : '', w && +rec.late ? fmtHM(rec.late) : '', w && +rec.early ? fmtHM(rec.early) : '', rec ? (rec.by || '') : ''];
      r++;
    });
  });
  for (let i = 1; i < r; i++) for (let j = 1; j <= h3.length; j++) {
    const cell = w3.getRow(i).getCell(j); cell.font = i === 1 ? BOLD : FONT; cell.border = BORDER;
    if (i === 1) cell.fill = HEAD;
  }
  w3.views = [{ state: 'frozen', xSplit: 1, ySplit: 1 }];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '自己申告_' + SH.facility + '_' + SH.label + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
init();
</script>
</body>
</html>
